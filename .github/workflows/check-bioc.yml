name: check-bioc

on:
  push:
    branches: [master, devel]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, to notice breakage caused by updated dependencies
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bioccheck:
    name: R CMD check + BiocCheck (Bioconductor devel)
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          Rscript -e 'BiocManager::install(c("BiocCheck", "remotes"),
              ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_deps(dependencies = TRUE,
              repos = BiocManager::repositories(), upgrade = "never")'

      - name: Build
        run: R CMD build .

      - name: R CMD check
        run: R CMD check --no-manual OmaDB_*.tar.gz

      - name: BiocCheck
        run: |
          Rscript -e 'BiocCheck::BiocCheck(
              Sys.glob("OmaDB_*.tar.gz"), `quit-with-status` = TRUE)'

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bioccheck-results
          path: |
            OmaDB.Rcheck
            OmaDB.BiocCheck

  check:
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release, devel]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true
